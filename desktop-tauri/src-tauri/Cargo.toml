[package]
name = "grok-remote-desktop"
version = "1.4.4"
description = "Grok Remote desktop shell"
authors = ["Anthony"]
edition = "2021"
[lib]
name = "grok_remote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
[profile.release]
lto = true
codegen-units = 1
